services:
  # Servicio Web Unificado: API Backend (Node.js/Express) + Plataforma Web Administrativa
  # rootDir: backend incluye tanto la API (src/) como la plataforma web (public/index.html y public/login.html)
  # Acceso web en Render: https://<tu-servicio>.onrender.com/ (o /index.html, /login.html, /admin)
  - type: web
    name: backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

databases:
  - name: asistencia-db
    databaseName: asistencia_db
    user: asistencia_user
    plan: basic-256mb
