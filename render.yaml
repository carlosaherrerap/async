databases:
  - name: asistencia_db
    plan: free

services:
  - type: web
    name: backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia_db
          property: connectionString
      - key: PORT
        value: 10000
